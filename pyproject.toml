[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signalign"
version = "1.1.0"
description = "Signer-consistent canonicalization and bounded palm-canonical refinement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "smplx>=0.1.28", "torch>=2.1"]

[project.urls]
Repository = "https://github.com/Hieuvu4438/SignAlign"

[tool.setuptools.packages.find]
where = ["src"]
