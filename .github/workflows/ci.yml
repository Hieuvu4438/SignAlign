name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: CLI smoke tests
        run: |
          for command in infer prepare-manifests build-initializer prepare-wilor import-wilor merge-wilor validate-wilor export evaluate; do
            signalign "$command" --help > /dev/null
          done
          for script in scripts/setup_external.py scripts/run_dexavatar_wilor.py scripts/export_wilor_for_dexavatar.py scripts/extract_wilor.py scripts/audit_release.py; do
            python "$script" --help > /dev/null
          done
      - name: Build distributions
        run: python -m build
